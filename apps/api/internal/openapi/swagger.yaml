info:
  contact: {}
  description: 'REST API платформы Sb0rka: проекты, базы данных, секреты, теги.'
  title: Sb0rka Platform API
  version: 0.1.0
paths:
  /account/initialize:
    post:
      description: Назначает план аккаунта по умолчанию. Повторный вызов сохраняет
        существующий план; перед созданием проекта инициализация обязательна.
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Инициализировать аккаунт
      tags:
      - iam
  /account/plan:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/contract.PlanResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Получить тариф аккаунта
      tags:
      - iam
  /plan/{plan_id}:
    get:
      description: Авторизованному пользователю доступны публичные активные тарифы,
        а также тариф его аккаунта и тарифы проектов, в которых он состоит, независимо
        от is_public и is_available.
      parameters:
      - description: UUID тарифа
        format: uuid
        in: path
        name: plan_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/contract.PlanResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Получить тариф по ID
      tags:
      - iam
  /plans:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: '{\"plans\": [...]}'
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/contract.PlanResponse'
              type: array
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Список публичных тарифов
      tags:
      - iam
  /projects:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/contract.ProjectListResponse'
      security:
      - BearerAuth: []
      summary: Список проектов пользователя
      tags:
      - projects
    post:
      consumes:
      - application/json
      description: Требует предварительного POST /account/initialize. Проект получает
        план по умолчанию. owner_subject_id по умолчанию — текущий пользователь; организация
        допустима только для её owner, billing при этом ставится на этого owner.
      parameters:
      - description: Параметры проекта
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/contract.CreateProjectRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/contract.ProjectResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Создать проект
      tags:
      - projects
  /projects/{project_id}:
    delete:
      description: Проект можно удалить только если в нём нет баз данных.
      parameters:
      - description: Public ID проекта (10 строчных hex-символов)
        in: path
        maxLength: 10
        minLength: 10
        name: project_id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Удалить проект
      tags:
      - projects
    get:
      parameters:
      - description: Public ID проекта (10 строчных hex-символов)
        in: path
        maxLength: 10
        minLength: 10
        name: project_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/contract.ProjectResponse'
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Получить проект
      tags:
      - projects
    patch:
      consumes:
      - application/json
      parameters:
      - description: Public ID проекта (10 строчных hex-символов)
        in: path
        maxLength: 10
        minLength: 10
        name: project_id
        required: true
        type: string
      - description: Новые имя/описание
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/contract.UpdateProjectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/contract.ProjectResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Обновить метаданные проекта
      tags:
      - projects
  /projects/{project_id}/dbi:
    post:
      consumes:
      - application/json
      parameters:
      - description: Public ID проекта (10 строчных hex-символов)
        in: path
        maxLength: 10
        minLength: 10
        name: project_id
        required: true
        type: string
      - description: Параметры инстанса БД
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/contract.CreateDBInstanceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/contract.DatabaseWithSecretResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Создать инстанс БД
      tags:
      - dbis
  /projects/{project_id}/dbis:
    get:
      parameters:
      - description: Public ID проекта (10 строчных hex-символов)
        in: path
        maxLength: 10
        minLength: 10
        name: project_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/contract.DBInstanceListResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Список инстансов БД проекта
      tags:
      - dbis
  /projects/{project_id}/members:
    get:
      parameters:
      - description: Public ID проекта (10 строчных hex-символов)
        in: path
        maxLength: 10
        minLength: 10
        name: project_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/contract.ProjectMemberListResponse'
        "403":
          description: Forbidden
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Список участников проекта
      tags:
      - project-members
    post:
      consumes:
      - application/json
      parameters:
      - description: Public ID проекта (10 строчных hex-символов)
        in: path
        maxLength: 10
        minLength: 10
        name: project_id
        required: true
        type: string
      - description: Subject и роль
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/contract.CreateProjectMemberRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/contract.ProjectMemberResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Добавить участника проекта
      tags:
      - project-members
  /projects/{project_id}/members/{subject_id}:
    delete:
      parameters:
      - description: Public ID проекта (10 строчных hex-символов)
