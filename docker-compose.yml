name: sb0rka-dev

services:
  postgres:
    extends:
      file: docker-compose.base.yml
      service: postgres

  keygen:
    extends:
      file: docker-compose.base.yml
      service: keygen

  migrate:
    extends:
      file: docker-compose.base.yml
      service: migrate

  dev-setup:
    extends:
      file: docker-compose.base.yml
      service: dev-setup

  seed-community:
    image: postgres:18
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: postgres
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-v", "DB_API_SCHEMA_NAME=api", "-h", "postgres", "-U", "postgres", "-d", "platform", "-f", "/community-api-data-feed.sql"]
    volumes:
      - ./db/migrations/seed/610-initial_api_data_feed.sql:/community-api-data-feed.sql:ro
    restart: "no"

  api:
    extends:
      file: docker-compose.base.yml
      service: api
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      dev-setup:
        condition: service_completed_successfully
      keygen:
        condition: service_completed_successfully
      seed-community:
        condition: service_completed_successfully

  auth:
    extends:
      file: docker-compose.base.yml
      service: auth

  drones:
    extends:
      file: docker-compose.base.yml
      service: drones

  proxy:
    extends:
      file: docker-compose.base.yml
      service: proxy

volumes:
  pgdata:
  keys:
  gomod:
