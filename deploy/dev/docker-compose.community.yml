services:
  seed-community:
    image: postgres:18
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: postgres
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-v", "DB_API_SCHEMA_NAME=api", "-h", "postgres", "-U", "postgres", "-d", "platform", "-f", "/community-api-data-feed.sql"]
    volumes:
      - ./db/migrations/seed/610-initial_api_data_feed.sql:/community-api-data-feed.sql:ro
    restart: "no"

  api:
    depends_on:
      seed-community:
        condition: service_completed_successfully
